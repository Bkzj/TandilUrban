services:
  db:
    image: postgres:16-alpine
    container_name: propea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: propea_group
    ports:
      - '5432:5432'
    volumes:
      - propea_pg_data:/var/lib/postgresql/data
    networks:
      - propea-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d propea_group']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: propea-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - propea-network

networks:
  propea-network:
    name: propea-network
    driver: bridge

volumes:
  propea_pg_data:
